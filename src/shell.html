<body>
<header class="topbar">
  <div class="logo">DRA<small>COMMS PLATFORM</small></div>

  <button class="tb-pill" id="ext"></button>

  <button class="tb-pill" id="newBtn">＋ New activity</button>
  <button class="tb-pill" id="logout">⇥ Log out</button>
</header>
<div class="proto-bar">
  <b>INTERNAL PROTOTYPE · FICTIONAL CUSTOMER DATA</b><span>DRA Homes Delight Team module for PMB. Not connected to PMB, MCube, Gallabox, Workhall or ERP, and nothing is sent. Feedback stays in your browser.</span>

  <label>View as <select id="asUser"></select></label>
  <label><input type="checkbox" id="devToggle"> Dev notes</label>
  <button id="resetBtn">Reset demo data</button>
</div>
<div class="shell"><aside class="side" id="side"></aside><main class="main" id="main"></main></div>
<button class="fb-fab" id="fbFab">💬 Feedback <span id="fbCount">0</span></button>
